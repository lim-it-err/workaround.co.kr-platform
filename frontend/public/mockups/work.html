<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작업실</title><style>*{box-sizing:border-box}body{margin:0;background:#0A0F16;color:#F3F6FB;font:15px/1.5 system-ui}header{position:fixed;inset:0 0 auto;z-index:9;padding:7px;text-align:center;background:#F3C544;color:#111;font-size:12px;font-weight:800}main{max-width:760px;margin:auto;padding:58px 20px}.hero{border-left:3px solid #35C275;padding:12px 18px;margin:24px 0 30px}h1{font-size:34px;margin:0}.muted{color:#AEB8C8}.row{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.09)}.dot{width:8px;height:8px;border-radius:50%;background:#35C275}.wait{background:#F3C544}.status{color:#7C8AA0;font-size:12px}.command{display:flex;gap:8px;margin-top:28px}input{flex:1;min-width:0;padding:12px;background:#1A212D;color:#F3F6FB;border:1px solid rgba(255,255,255,.16);border-radius:8px}button{padding:12px;border:0;border-radius:8px;background:#7C89F0;color:#fff}@media(min-width:700px){main{padding-top:76px}}</style><header>MOCKUP — 실화면 아님 · tone r1</header><main><section class="hero"><small class="muted">지금 볼 것</small><h1>검토 대기 2건</h1><p class="muted">결정이 필요한 작업만 앞에 둡니다.</p></section><div class="row"><span class="dot wait"></span><div><b>여행 화면 톤 적용</b><div class="muted">시각 검토 필요</div></div><span class="status">검토</span></div><div class="row"><span class="dot wait"></span><div><b>새 시뮬레이션 묶음</b><div class="muted">내용 확인 필요</div></div><span class="status">검토</span></div><div class="row"><span class="dot"></span><div><b>정적 배포 준비</b><div class="muted">검증 진행 중</div></div><span class="status">진행</span></div><form class="command"><input aria-label="작업 지시" placeholder="다음 작업을 짧게 적기"><button>보내기</button></form></main></html>

<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시작 화면 톤 목업</title>
<style>
:root{color-scheme:dark;--bg:#0D131C;--text:#F3F6FB;--muted:#AEB8C8;--line:#7C8AA0;--safety:#F3C544}
*{box-sizing:border-box}
html,body{min-width:0;min-height:100%;margin:0;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow-x:hidden}
.mockup-banner{position:fixed;inset:0 0 auto;z-index:10;padding:7px;text-align:center;background:var(--safety);color:#111;font-size:12px;font-weight:800}
.stage{min-height:100svh;display:grid;place-items:center;padding:70px 24px 48px;text-align:center}
.arrival{width:min(100%,520px);display:grid;justify-items:center}
.roundel{position:relative;width:136px;height:136px;display:grid;place-items:center;border:2px solid var(--safety);border-radius:50%;font-size:52px;font-weight:850;line-height:1;letter-spacing:-.06em}
.roundel::before{content:"";position:absolute;inset:-11px;border:1px solid rgba(243,197,68,.34);border-radius:inherit;animation:ring 10s ease-out forwards}
.wordmark{margin:34px 0 0;font-size:clamp(28px,8vw,44px);line-height:1.1;letter-spacing:-.045em}
.copy{margin:12px 0 0;color:var(--muted);font-size:clamp(15px,4vw,18px);letter-spacing:-.02em}
.flap{display:flex;gap:3px;margin-top:34px;perspective:540px}
.flap-cell{position:relative;width:24px;height:36px;display:grid;place-items:center;border:1px solid rgba(174,184,200,.16);border-radius:3px;background:#121A25;color:#E8EDF5;font:700 15px/1 ui-monospace,SFMono-Regular,monospace;box-shadow:inset 0 1px rgba(255,255,255,.05);animation:flip 1.1s cubic-bezier(.4,0,.2,1) both}
.flap-cell::after{content:"";position:absolute;inset:50% 1px auto;height:1px;background:#070B10}
.flap-cell:nth-child(2){animation-delay:.08s}.flap-cell:nth-child(3){animation-delay:.16s}.flap-cell:nth-child(4){animation-delay:.24s}.flap-cell:nth-child(5){animation-delay:.32s}.flap-cell:nth-child(6){animation-delay:.4s}.flap-cell:nth-child(7){animation-delay:.48s}.flap-cell:nth-child(8){animation-delay:.56s}.flap-cell:nth-child(9){animation-delay:.64s}.flap-cell:nth-child(10){animation-delay:.72s}
.notice{display:flex;align-items:center;gap:9px;max-width:100%;margin:22px 0 0;color:var(--muted);font-size:12px;white-space:nowrap}
.notice::before{content:"";width:5px;height:5px;flex:0 0 auto;border-radius:50%;background:var(--safety)}
.auto{margin:8px 0 0;color:var(--line);font-size:11px;letter-spacing:.06em}
.threshold{position:relative;width:min(76vw,340px);height:62px;margin-top:30px}
.progress{position:absolute;inset:auto 0 0;height:1px;background:rgba(174,184,200,.22);overflow:hidden}
.progress::after{content:"";display:block;width:100%;height:100%;background:var(--safety);transform:scaleX(0);transform-origin:left center;animation:progress 10s linear forwards}
.door{position:absolute;left:50%;top:0;width:1px;height:34px;background:var(--line);opacity:.8;transform:translateX(-.5px);animation-duration:10s;animation-timing-function:cubic-bezier(.72,0,.2,1);animation-fill-mode:forwards}
.door.left{animation-name:door-left}.door.right{animation-name:door-right}
@keyframes progress{to{transform:scaleX(1)}}
@keyframes flip{0%{transform:rotateX(-90deg);opacity:0}55%{transform:rotateX(8deg);opacity:1}100%{transform:rotateX(0)}}
@keyframes ring{0%{transform:scale(.92);opacity:.25}65%{transform:scale(1);opacity:.55}100%{transform:scale(1.04);opacity:.22}}
@keyframes door-left{0%,82%{transform:translateX(-.5px)}100%{transform:translateX(-112px)}}
@keyframes door-right{0%,82%{transform:translateX(-.5px)}100%{transform:translateX(111px)}}
@media(max-width:420px){.roundel{width:116px;height:116px;font-size:44px}.wordmark{margin-top:30px}.flap-cell{width:22px;height:34px;font-size:14px}.notice{font-size:11px}.threshold{margin-top:26px}}
@media(prefers-reduced-motion:reduce){.roundel::before,.flap-cell,.progress::after,.door{animation:none!important}}
</style>
<header class="mockup-banner">MOCKUP — 실화면 아님 · tone r4</header>
<main class="stage">
  <section class="arrival" aria-labelledby="splash-title">
    <div class="roundel" aria-hidden="true">W</div>
    <h1 class="wordmark" id="splash-title">workaround.co.kr</h1>
    <p class="copy">곧 문이 열립니다</p>
    <div class="flap" aria-label="WORKAROUND">
      <span class="flap-cell">W</span><span class="flap-cell">O</span><span class="flap-cell">R</span><span class="flap-cell">K</span><span class="flap-cell">A</span><span class="flap-cell">R</span><span class="flap-cell">O</span><span class="flap-cell">U</span><span class="flap-cell">N</span><span class="flap-cell">D</span>
    </div>
    <p class="notice">에스컬레이터 방향 다수결로 정하는 중…</p>
    <p class="auto">10초 후 자동 전환</p>
    <div class="threshold" aria-hidden="true">
      <span class="door left"></span>
      <span class="door right"></span>
      <span class="progress"></span>
    </div>
  </section>
</main>
</html>

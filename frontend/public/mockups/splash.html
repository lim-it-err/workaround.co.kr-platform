<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>시작 화면 — 톤 목업</title>
  <style>
    :root{color-scheme:dark;--bg:#0D131C;--text:#F3F6FB;--text-2:#AEB8C8;--muted:#7C8AA0;--line:rgba(255,255,255,.16);--safety:#F3C544;--door:#18212D}*{box-sizing:border-box}html,body{min-width:0;min-height:100%;margin:0;background:var(--bg);color:var(--text)}body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow-x:hidden}.mockup-banner{position:fixed;inset:0 0 auto;z-index:10;padding:7px;text-align:center;background:var(--safety);color:#111;font-size:12px;font-weight:800}.stage{min-height:100svh;display:grid;place-items:center;padding:66px 24px 40px;text-align:center}.arrival{width:min(100%,540px);display:grid;justify-items:center}
    .doorway{position:relative;width:158px;height:142px;display:grid;place-items:center;overflow:hidden}.roundel{width:116px;height:116px;display:grid;place-items:center;border:2px solid var(--safety);border-radius:50%;font-size:46px;font-weight:850;line-height:1;letter-spacing:-.06em}.door-panel{position:absolute;inset:0 50% 0 0;z-index:2;background:var(--door);animation:open-left 10s cubic-bezier(.7,0,.2,1) forwards}.door-panel.right{inset:0 0 0 50%;animation-name:open-right}.door-panel.left{border-right:1px solid var(--line)}.wordmark{margin:24px 0 0;font-size:clamp(28px,8vw,44px);line-height:1.08;letter-spacing:-.045em}.copy{margin:10px 0 0;color:var(--text-2);font-size:clamp(15px,4vw,18px);letter-spacing:-.02em}
    .flap{position:relative;width:min(100%,390px);height:36px;margin-top:24px;perspective:540px}.flap-word{position:absolute;inset:0;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;opacity:0;transform-origin:center}.flap-cell{position:relative;min-width:0;height:36px;display:grid;place-items:center;border:1px solid rgba(174,184,200,.16);border-radius:3px;background:#121A25;color:#E8EDF5;font:700 clamp(10px,3.2vw,14px)/1 ui-monospace,SFMono-Regular,monospace}.flap-cell::after{content:"";position:absolute;inset:50% 1px auto;height:1px;background:#070B10}.flap-word:nth-child(1){animation:flap-one 10s linear forwards}.flap-word:nth-child(2){animation:flap-two 10s linear forwards}.flap-word:nth-child(3){animation:flap-three 10s linear forwards}.flap-word:nth-child(4){animation:flap-four 10s linear forwards}
    .ticker{position:relative;width:min(100%,390px);height:22px;margin-top:20px;color:var(--text-2);font-size:12px;white-space:nowrap}.ticker::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--safety)}.ticker span{position:absolute;inset:0 0 0 14px;text-align:left;opacity:0}.ticker span:nth-child(1){animation:ticker-one 10s step-end forwards}.ticker span:nth-child(2){animation:ticker-two 10s step-end forwards}.ticker span:nth-child(3){animation:ticker-three 10s step-end forwards}.auto{margin:6px 0 0;color:var(--muted);font-size:11px;letter-spacing:.05em}.progress{position:relative;width:min(76vw,340px);height:1px;margin-top:24px;background:rgba(174,184,200,.22);overflow:hidden}.progress::after{content:"";display:block;width:100%;height:100%;background:var(--safety);transform:scaleX(0);transform-origin:left center;animation:progress 10s linear forwards}
    @keyframes progress{to{transform:scaleX(1)}}@keyframes ticker-one{0%,32.9%{opacity:1}33%,100%{opacity:0}}@keyframes ticker-two{0%,32.9%{opacity:0}33%,65.9%{opacity:1}66%,100%{opacity:0}}@keyframes ticker-three{0%,65.9%{opacity:0}66%,100%{opacity:1}}@keyframes open-left{0%,85%{transform:translateX(0)}100%{transform:translateX(-102%)}}@keyframes open-right{0%,85%{transform:translateX(0)}100%{transform:translateX(102%)}}
    @keyframes flap-one{0%,29%{opacity:1;transform:rotateX(0)}32.9%{opacity:0;transform:rotateX(90deg)}33%,100%{opacity:0;transform:rotateX(90deg)}}
    @keyframes flap-two{0%,32.9%{opacity:0;transform:rotateX(-90deg)}33%{opacity:1;transform:rotateX(-90deg)}36%,62%{opacity:1;transform:rotateX(0)}65.9%{opacity:0;transform:rotateX(90deg)}66%,100%{opacity:0;transform:rotateX(90deg)}}
    @keyframes flap-three{0%,65.9%{opacity:0;transform:rotateX(-90deg)}66%{opacity:1;transform:rotateX(-90deg)}69%,81%{opacity:1;transform:rotateX(0)}84.9%{opacity:0;transform:rotateX(90deg)}85%,100%{opacity:0;transform:rotateX(90deg)}}
    @keyframes flap-four{0%,84.9%{opacity:0;transform:rotateX(-90deg)}85%{opacity:1;transform:rotateX(-90deg)}88%,100%{opacity:1;transform:rotateX(0)}}
    @media(min-width:700px){.doorway{width:178px;height:158px}.roundel{width:136px;height:136px;font-size:52px}.wordmark{margin-top:28px}.flap{height:38px}.flap-cell{height:38px;font-size:14px}}@media(max-width:420px){.ticker{font-size:11px}.ticker span{overflow:hidden;text-overflow:ellipsis}}
    @media(prefers-reduced-motion:reduce){.ticker span,.progress::after,.door-panel,.flap-word{animation:none!important}.ticker span{opacity:0}.ticker span:first-child{opacity:1}.door-panel{transform:translateX(-102%)}.door-panel.right{transform:translateX(102%)}.flap-word{opacity:0;transform:none}.flap-word:first-child{opacity:1}}
  </style>
</head>
<body>
  <header class="mockup-banner">MOCKUP — 실화면 아님 · tone r6</header>
  <main class="stage"><section class="arrival" aria-labelledby="splash-title">
    <div class="doorway" aria-hidden="true"><div class="roundel">W</div><span class="door-panel left"></span><span class="door-panel right"></span></div>
    <h1 class="wordmark" id="splash-title">workaround.co.kr</h1><p class="copy">곧 문이 열립니다</p>
    <div class="flap" aria-label="WORKAROUND, WORKING AROUND, MIND THE GAP, DOORS OPENING 순서로 전환">
      <div class="flap-word" aria-hidden="true"><span class="flap-cell">&nbsp;</span><span class="flap-cell">&nbsp;</span><span class="flap-cell">W</span><span class="flap-cell">O</span><span class="flap-cell">R</span><span class="flap-cell">K</span><span class="flap-cell">A</span><span class="flap-cell">R</span><span class="flap-cell">O</span><span class="flap-cell">U</span><span class="flap-cell">N</span><span class="flap-cell">D</span><span class="flap-cell">&nbsp;</span><span class="flap-cell">&nbsp;</span></div>
      <div class="flap-word" aria-hidden="true"><span class="flap-cell">W</span><span class="flap-cell">O</span><span class="flap-cell">R</span><span class="flap-cell">K</span><span class="flap-cell">I</span><span class="flap-cell">N</span><span class="flap-cell">G</span><span class="flap-cell">&nbsp;</span><span class="flap-cell">A</span><span class="flap-cell">R</span><span class="flap-cell">O</span><span class="flap-cell">U</span><span class="flap-cell">N</span><span class="flap-cell">D</span></div>
      <div class="flap-word" aria-hidden="true"><span class="flap-cell">&nbsp;</span><span class="flap-cell">M</span><span class="flap-cell">I</span><span class="flap-cell">N</span><span class="flap-cell">D</span><span class="flap-cell">&nbsp;</span><span class="flap-cell">T</span><span class="flap-cell">H</span><span class="flap-cell">E</span><span class="flap-cell">&nbsp;</span><span class="flap-cell">G</span><span class="flap-cell">A</span><span class="flap-cell">P</span><span class="flap-cell">&nbsp;</span></div>
      <div class="flap-word" aria-hidden="true"><span class="flap-cell">&nbsp;</span><span class="flap-cell">D</span><span class="flap-cell">O</span><span class="flap-cell">O</span><span class="flap-cell">R</span><span class="flap-cell">S</span><span class="flap-cell">&nbsp;</span><span class="flap-cell">O</span><span class="flap-cell">P</span><span class="flap-cell">E</span><span class="flap-cell">N</span><span class="flap-cell">I</span><span class="flap-cell">N</span><span class="flap-cell">G</span></div>
    </div>
    <p class="ticker" aria-label="환승 홀을 준비하는 중"><span>에스컬레이터 방향 다수결로 정하는 중…</span><span>지연 시간을 정성껏 반올림하는 중…</span><span>출구 번호에 서열 매기는 중…</span></p><p class="auto">10초 후 자동 전환</p><div class="progress" aria-hidden="true"></div>
  </section></main>
</body>
</html>

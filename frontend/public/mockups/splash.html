<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>시작 화면 — 톤 목업</title>
  <style>
    :root{color-scheme:dark;--bg:#0D131C;--text:#F3F6FB;--text-2:#AEB8C8;--muted:#7C8AA0;--line:rgba(255,255,255,.16);--safety:#F3C544;--door:#18212D}
    *{box-sizing:border-box}
    html,body{min-width:0;min-height:100%;margin:0;background:var(--bg);color:var(--text)}
    body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow-x:hidden}
    .mockup-banner{position:fixed;inset:0 0 auto;z-index:10;padding:7px;text-align:center;background:var(--safety);color:#111;font-size:12px;font-weight:800}
    .stage{min-height:100svh;display:grid;place-items:center;padding:66px 24px 40px;text-align:center}
    .arrival{width:min(100%,540px);display:grid;justify-items:center}
    .doorway{position:relative;width:158px;height:142px;display:grid;place-items:center;overflow:hidden}
    .roundel{width:116px;height:116px;display:grid;place-items:center;border:2px solid var(--safety);border-radius:50%;font-size:46px;font-weight:850;line-height:1;letter-spacing:-.06em}
    .door-panel{position:absolute;inset:0 50% 0 0;z-index:2;background:var(--door);animation:open-left 10s cubic-bezier(.7,0,.2,1) forwards}
    .door-panel.right{inset:0 0 0 50%;animation-name:open-right}
    .door-panel.left{border-right:1px solid var(--line)}
    .wordmark{margin:24px 0 0;font-size:clamp(28px,8vw,44px);line-height:1.08;letter-spacing:-.045em}
    .copy{margin:10px 0 0;color:var(--text-2);font-size:clamp(15px,4vw,18px);letter-spacing:-.02em}
    .flap{display:flex;gap:3px;margin-top:24px;perspective:540px}
    .flap-cell{position:relative;width:22px;height:34px;display:grid;place-items:center;border:1px solid rgba(174,184,200,.16);border-radius:3px;background:#121A25;color:#E8EDF5;font:700 14px/1 ui-monospace,SFMono-Regular,monospace;animation:flip 1.1s cubic-bezier(.4,0,.2,1) both}
    .flap-cell::after{content:"";position:absolute;inset:50% 1px auto;height:1px;background:#070B10}
    .flap-cell:nth-child(2){animation-delay:.08s}.flap-cell:nth-child(3){animation-delay:.16s}.flap-cell:nth-child(4){animation-delay:.24s}.flap-cell:nth-child(5){animation-delay:.32s}.flap-cell:nth-child(6){animation-delay:.4s}.flap-cell:nth-child(7){animation-delay:.48s}.flap-cell:nth-child(8){animation-delay:.56s}.flap-cell:nth-child(9){animation-delay:.64s}.flap-cell:nth-child(10){animation-delay:.72s}
    .ticker{position:relative;width:min(100%,390px);height:22px;margin-top:20px;color:var(--text-2);font-size:12px;white-space:nowrap}
    .ticker::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--safety)}
    .ticker span{position:absolute;inset:0 0 0 14px;text-align:left;opacity:0}
    .ticker span:nth-child(1){animation:ticker-one 10s step-end forwards}
    .ticker span:nth-child(2){animation:ticker-two 10s step-end forwards}
    .ticker span:nth-child(3){animation:ticker-three 10s step-end forwards}
    .auto{margin:6px 0 0;color:var(--muted);font-size:11px;letter-spacing:.05em}
    .progress{position:relative;width:min(76vw,340px);height:1px;margin-top:24px;background:rgba(174,184,200,.22);overflow:hidden}
    .progress::after{content:"";display:block;width:100%;height:100%;background:var(--safety);transform:scaleX(0);transform-origin:left center;animation:progress 10s linear forwards}
    .door-copy{margin:10px 0 0;color:var(--muted);font:500 11px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:.08em;text-transform:lowercase;opacity:0;animation:door-copy 10s step-end forwards}
    @keyframes progress{to{transform:scaleX(1)}}
    @keyframes flip{0%{transform:rotateX(-90deg);opacity:0}55%{transform:rotateX(8deg);opacity:1}100%{transform:rotateX(0)}}
    @keyframes ticker-one{0%,32.9%{opacity:1}33%,100%{opacity:0}}
    @keyframes ticker-two{0%,32.9%{opacity:0}33%,65.9%{opacity:1}66%,100%{opacity:0}}
    @keyframes ticker-three{0%,65.9%{opacity:0}66%,100%{opacity:1}}
    @keyframes open-left{0%,85%{transform:translateX(0)}100%{transform:translateX(-102%)}}
    @keyframes open-right{0%,85%{transform:translateX(0)}100%{transform:translateX(102%)}}
    @keyframes door-copy{0%,84.9%{opacity:0}85%,100%{opacity:1}}
    @media(min-width:700px){.doorway{width:178px;height:158px}.roundel{width:136px;height:136px;font-size:52px}.wordmark{margin-top:28px}.flap-cell{width:24px;height:36px;font-size:15px}}
    @media(max-width:420px){.ticker{font-size:11px}.ticker span{overflow:hidden;text-overflow:ellipsis}}
    @media(prefers-reduced-motion:reduce){.flap-cell,.ticker span,.progress::after,.door-copy{animation:none!important}.ticker span{opacity:0}.ticker span:first-child{opacity:1}.door-panel{animation:none!important;transform:translateX(-102%)}.door-panel.right{transform:translateX(102%)}.door-copy{opacity:1}}
  </style>
</head>
<body>
  <header class="mockup-banner">MOCKUP — 실화면 아님 · tone r5</header>
  <main class="stage">
    <section class="arrival" aria-labelledby="splash-title">
      <div class="doorway" aria-hidden="true">
        <div class="roundel">W</div>
        <span class="door-panel left"></span>
        <span class="door-panel right"></span>
      </div>
      <h1 class="wordmark" id="splash-title">workaround.co.kr</h1>
      <p class="copy">곧 문이 열립니다</p>
      <div class="flap" aria-label="WORKAROUND">
        <span class="flap-cell">W</span><span class="flap-cell">O</span><span class="flap-cell">R</span><span class="flap-cell">K</span><span class="flap-cell">A</span><span class="flap-cell">R</span><span class="flap-cell">O</span><span class="flap-cell">U</span><span class="flap-cell">N</span><span class="flap-cell">D</span>
      </div>
      <p class="ticker" aria-label="환승 홀을 준비하는 중">
        <span>에스컬레이터 방향 다수결로 정하는 중…</span>
        <span>지연 시간을 정성껏 반올림하는 중…</span>
        <span>출구 번호에 서열 매기는 중…</span>
      </p>
      <p class="auto">10초 후 자동 전환</p>
      <div class="progress" aria-hidden="true"></div>
      <p class="door-copy">doors opening</p>
    </section>
  </main>
</body>
</html>

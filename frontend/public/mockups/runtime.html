<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>런타임</title><style>*{box-sizing:border-box}body{margin:0;background:#0A0F16;color:#F3F6FB;font:15px/1.5 system-ui}header{position:fixed;inset:0 0 auto;z-index:9;padding:7px;text-align:center;background:#F3C544;color:#111;font-size:12px;font-weight:800}main{max-width:760px;margin:auto;padding:58px 20px}.hero{border-left:3px solid #5B8DEF;padding:12px 18px;margin:24px 0 30px}h1{font-size:34px;margin:0 0 7px}.muted{color:#AEB8C8}.row{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.09)}.dot{width:8px;height:8px;border-radius:50%;background:#35C275}.warn{background:#F3C544}.metric{color:#AEB8C8;font-variant-numeric:tabular-nums}button{margin-top:28px;padding:11px 14px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:#1A212D;color:#F3F6FB}@media(min-width:700px){main{padding-top:76px}}</style><header>MOCKUP — 실화면 아님 · tone r1</header><main><section class="hero"><small class="muted">주의가 필요한 신호</small><h1>응답 지연이 평소보다 깁니다</h1><p class="muted">서비스는 동작 중이며 최근 10분의 변화입니다.</p></section><div class="row"><span class="dot"></span><div><b>웹 화면</b><div class="muted">정상</div></div><span class="metric">82 ms</span></div><div class="row"><span class="dot warn"></span><div><b>인공지능 응답</b><div class="muted">지연</div></div><span class="metric">2.8 s</span></div><div class="row"><span class="dot"></span><div><b>정적 콘텐츠</b><div class="muted">정상</div></div><span class="metric">41 ms</span></div><div class="row"><span class="dot"></span><div><b>저장소 연결</b><div class="muted">정상</div></div><span class="metric">126 ms</span></div><button>상태 새로고침</button></main></html>

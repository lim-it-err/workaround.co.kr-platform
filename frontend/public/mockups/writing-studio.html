<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글쓰기 — 톤 목업</title>
  <style>
    :root{color-scheme:dark;--bg:#111721;--text:#F3F6FB;--text-2:#AEB8C8;--muted:#7C8AA0;--line:rgba(255,255,255,.11);--panel:#171F2B;--accent:#7C89F0;--success:#35C275;--safety:#F3C544}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}
    button,input,textarea{font:inherit}
    .mockup-banner{position:fixed;inset:0 0 auto;z-index:10;padding:7px;text-align:center;background:var(--safety);color:#111;font-size:12px;font-weight:800}
    .bar{position:fixed;z-index:8;top:30px;inset-inline:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg)}
    .doc{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
    .save{font-size:12px;color:var(--success);white-space:nowrap}.controls{display:flex;gap:7px}
    button{min-height:36px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:7px 10px;cursor:pointer}
    button:hover{border-color:rgba(255,255,255,.28)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.tool-toggle{display:none}
    .workspace{max-width:1320px;margin:auto;padding:116px 20px 40px}
    .editor{min-width:0;max-width:720px;margin-inline:auto}
    .title{display:block;width:100%;min-height:1.25em;padding:0;border:0;background:transparent;color:var(--text);font:700 34px/1.25 system-ui;outline:0;field-sizing:content;resize:vertical;word-break:keep-all;overflow-wrap:anywhere}
    .body{width:100%;min-height:62vh;margin-top:24px;padding:0;border:0;background:transparent;color:var(--text);font:17px/1.8 system-ui;resize:none;outline:0}
    .tools{display:none}.tool-group{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}.tool-group:last-child{border-bottom:0}.tool-group h2{margin:0 0 9px;color:var(--text-2);font-size:12px;font-weight:650}.tool-list{display:grid;gap:7px}.tool-list button{width:100%;text-align:left}.heading-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.heading-tools button{text-align:center;padding-inline:4px;font-weight:750}
    .table-editor{display:grid;gap:8px}.table-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.table-actions button{padding:5px;font-size:12px}.table-preview{width:100%;border-collapse:collapse;table-layout:fixed}.table-preview td{padding:0;border:1px solid var(--line)}.table-preview input{width:100%;height:29px;padding:4px 6px;border:0;background:transparent;color:var(--text);font-size:11px}.insert{border-color:rgba(124,137,240,.65);color:#C5CBFA;text-align:center!important}
    @media(min-width:900px){.workspace{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,720px) minmax(110px,1fr);gap:20px}.editor{grid-column:2;width:100%}.tools{grid-column:3;display:block;width:min(100%,190px);padding:12px 0 0 18px;border-left:1px solid var(--line)}}
    @media(max-width:899px){.workspace{padding-top:110px}.title{font-size:30px}.preview,.doc{display:none}.controls{margin-left:auto}.tool-toggle{display:inline-block}.save{position:absolute;top:52px;right:14px}.body{min-height:68vh}}
    @media(max-width:420px){.bar{gap:5px;padding-inline:8px}.bar button{padding-inline:8px}.tool-toggle{font-size:0}.tool-toggle::after{content:"도구";font-size:13px}.more{display:none}}
  </style>
</head>
<body>
  <header class="mockup-banner">MOCKUP — 실화면 아님 · tone r5</header>
  <div class="bar">
    <button aria-label="블로그로 나가기">← 블로그</button>
    <div class="doc">낯선 도시에서 속도를 고르는 법</div>
    <span class="save">저장됨</span>
    <div class="controls"><button class="preview">미리보기</button><button class="primary">발행</button><button class="tool-toggle" aria-label="도구 메뉴 열기">도구</button><button class="more" aria-label="더 보기">···</button></div>
  </div>
  <main class="workspace">
    <article class="editor" aria-label="글 편집 영역">
      <textarea class="title" rows="2" aria-label="제목">낯선 도시에서 속도를 고르는 법</textarea>
      <textarea class="body" aria-label="본문">좋은 일정은 빈틈이 없는 계획이 아니었다.

다음 선택을 쉽게 만드는 단서가 충분한 계획이었다.</textarea>
    </article>
    <aside class="tools" aria-label="글쓰기 도구 메뉴">
      <section class="tool-group"><h2>사진</h2><div class="tool-list"><button>＋ 사진 첨부</button></div></section>
      <section class="tool-group"><h2>제목 단계</h2><div class="heading-tools"><button>H1</button><button>H2</button><button>H3</button></div></section>
      <section class="tool-group table-editor">
        <h2>표</h2>
        <div class="table-actions"><button>＋ 행</button><button>− 행</button><button>＋ 열</button><button>− 열</button></div>
        <table class="table-preview" aria-label="표 미리보기"><tbody><tr><td><input aria-label="1행 1열" value="도시"></td><td><input aria-label="1행 2열" value="체류"></td></tr><tr><td><input aria-label="2행 1열" value="빈"></td><td><input aria-label="2행 2열" value="3일"></td></tr></tbody></table>
        <button class="insert">표 삽입</button>
      </section>
    </aside>
  </main>
</body>
</html>

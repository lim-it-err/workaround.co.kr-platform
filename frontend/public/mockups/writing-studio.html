<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글쓰기 — 톤 목업</title>
  <style>
    :root{color-scheme:dark;--bg:#111721;--text:#F3F6FB;--text-2:#AEB8C8;--muted:#7C8AA0;--line:rgba(255,255,255,.11);--panel:#171F2B;--accent:#7C89F0;--success:#35C275;--safety:#F3C544}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}
    button,input,textarea{font:inherit}
    .mockup-banner{position:fixed;inset:0 0 auto;z-index:10;padding:7px;text-align:center;background:var(--safety);color:#111;font-size:12px;font-weight:800}
    .bar{position:fixed;z-index:8;top:30px;inset-inline:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg)}
    .doc{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
    .save{font-size:12px;color:var(--success);white-space:nowrap}.controls{display:flex;gap:7px}
    button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:7px 10px;cursor:pointer}
    button:hover{border-color:rgba(255,255,255,.28)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
    button.primary{background:var(--accent);border-color:var(--accent);color:#101827}.tool-toggle{display:none}
    .workspace{max-width:1320px;margin:auto;padding:116px 20px 40px}
    .editor{min-width:0;max-width:720px;margin-inline:auto}
    .title{display:block;width:100%;min-height:1.25em;padding:0;border:0;background:transparent;color:var(--text);font:700 34px/1.25 system-ui;outline:0;field-sizing:content;resize:vertical;word-break:keep-all;overflow-wrap:anywhere}
    .body{width:100%;min-height:120px;margin-top:24px;padding:0;border:0;background:transparent;color:var(--text);font:17px/1.8 system-ui;resize:none;outline:0}
    .tools{display:none}.tool-group{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line)}.tool-group:last-child{border-bottom:0}.tool-group h2{margin:0 0 9px;color:var(--text-2);font-size:12px;font-weight:650}.tool-list{display:grid;gap:7px}.tool-list button{width:100%;text-align:left}.heading-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.heading-tools button{text-align:center;padding-inline:4px;font-weight:750}
    a{color:inherit;text-decoration:none}.button-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);white-space:nowrap}.button-link:focus-visible,a:focus-visible{outline:2px solid var(--safety);outline-offset:3px}.tool-toggle{display:none}.tools h2{margin:0 0 16px;font-size:16px}.tool-list{gap:10px}.tool-list .button-link{justify-content:flex-start}.tools-close{display:none}.body.after{min-height:180px;margin-top:28px}.inline-table{position:relative;margin:24px 0 0;padding:0 48px 48px 0;scroll-margin-top:120px}.inline-table table{width:100%;table-layout:fixed;border-collapse:collapse}.inline-table td,.inline-table th{position:relative;padding:0;border:1px solid var(--line)}.inline-table input{display:block;width:100%;min-width:0;min-height:52px;padding:12px 14px;border:0;background:transparent;color:var(--text);font-size:15px}.inline-table th input{font-weight:750}.inline-table .active-cell input{padding-right:46px}.cell-menu{position:absolute;right:1px;top:5px;min-width:40px;min-height:40px;padding:0;border-color:transparent;background:var(--panel);font-size:20px}.add-column,.add-row{position:absolute;min-height:44px;min-width:44px;font-size:12px;padding:5px}.add-column{right:0;top:4px}.add-row{bottom:0;left:calc((100% - 48px)/2 - 22px)}.table-outline{outline:1px solid var(--accent);outline-offset:-1px}.cell-options{display:none;position:absolute;right:48px;top:54px;z-index:3;min-width:160px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.cell-options:target{display:grid;gap:6px}.cell-options a{display:flex;min-height:40px;align-items:center;padding:5px 10px}.cell-options button{text-align:left}.inline-table:target{outline:2px solid var(--safety);outline-offset:6px}
    @media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#E4EAF2;--text:#16202E;--text-2:#45536A;--muted:#6B7A92;--line:rgba(16,24,38,.22);--panel:#FFFFFF;--success:#0E8A46;--safety:#E9B92B}button.primary{background:#4653B0;border-color:#4653B0;color:#fff}}
    @media(min-width:900px){.workspace{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,720px) minmax(110px,1fr);gap:20px}.editor{grid-column:2;width:100%}.tools{grid-column:3;display:block;width:min(100%,190px);padding:12px 0 0 18px;border-left:1px solid var(--line)}}
    @media(max-width:899px){.workspace{padding-top:110px}.title{font-size:30px}.preview,.doc{display:none}.controls{margin-left:auto}.tool-toggle{display:inline-block}.save{position:absolute;top:52px;right:14px}.body{min-height:140px}}
    @media(max-width:420px){.bar{gap:5px;padding-inline:8px}.bar button{padding-inline:8px}.tool-toggle{font-size:0}.tool-toggle::after{content:"도구";font-size:13px}.more{display:none}}
    @media(max-width:899px){.tools:target{display:block;position:fixed;z-index:12;inset:auto 0 0;max-height:75svh;overflow:auto;padding:24px 20px;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -20px 70px rgba(0,0,0,.5)}.tools-close{display:inline-flex;position:absolute;right:14px;top:12px;min-height:44px;min-width:44px;align-items:center;justify-content:center}.tools h2{margin-bottom:20px}.tools:target .tool-list{padding-top:8px}.tool-list button,.tool-list .button-link{min-height:48px}.tool-toggle{display:inline-flex}.title{min-height:2.5em}}
    @media(max-width:420px){.inline-table input{font-size:14px;padding-inline:10px}.inline-table .active-cell input{padding-right:42px}.button-link{padding-inline:8px}}
  </style>
</head>
<body>
  <header class="mockup-banner">MOCKUP — 실화면 아님 · tone r10</header>
  <div class="bar">
    <a class="button-link" href="blog-hub.html">← 블로그</a>
    <div class="doc">낯선 도시에서 속도를 고르는 법</div>
    <span class="save">저장됨</span>
    <div class="controls"><button class="preview">미리보기</button><button class="primary">발행</button><a class="button-link tool-toggle" href="#tools" aria-label="도구 메뉴 열기">도구</a><button class="more" aria-label="더 보기">···</button></div>
  </div>
  <main class="workspace">
    <article class="editor" aria-label="글 편집 영역">
      <textarea class="title" rows="2" aria-label="제목">낯선 도시에서 속도를 고르는 법</textarea>
      <textarea class="body" aria-label="본문">좋은 일정은 빈틈이 없는 계획이 아니었다.

다음 선택을 쉽게 만드는 단서가 충분한 계획이었다.</textarea>
      <div class="inline-table" id="inline-table" aria-label="본문에 삽입된 표 · 조작부가 보이는 상태">
        <table class="table-outline" aria-label="속도를 고르는 단서">
          <thead><tr><th><input aria-label="1열 제목" value="장면"></th><th><input aria-label="2열 제목" value="선택"></th></tr></thead>
          <tbody><tr><td class="active-cell"><input aria-label="1행 장면" value="골목"><a href="#cell-options" class="button-link cell-menu" aria-label="1행 1열 셀 메뉴">⋯</a></td><td><input aria-label="1행 선택" value="천천히 걷기"></td></tr><tr><td><input aria-label="2행 장면" value="광장"></td><td><input aria-label="2행 선택" value="잠시 앉기"></td></tr></tbody>
        </table>
        <button class="add-column" type="button" aria-label="열 추가 · 정적 목업">+열</button><button class="add-row" type="button" aria-label="행 추가 · 정적 목업">+행</button>
        <div class="cell-options" id="cell-options" aria-label="셀 메뉴"><a href="#inline-table">메뉴 닫기 ×</a><button type="button">행 삭제</button><button type="button">열 삭제</button></div>
      </div>
      <textarea class="body after" aria-label="표 다음 본문" placeholder="계속 쓰기…">표의 마지막 칸을 채우고 나서, 다시 문장으로 돌아왔다.</textarea>
    </article>
    <aside class="tools" id="tools" aria-label="글쓰기 도구 메뉴">
      <h2>글 도구</h2><a class="tools-close" href="#" aria-label="글 도구 닫기">닫기 ×</a>
      <div class="tool-list"><button type="button">사진 첨부</button><button type="button">H1 / H2 / H3</button><a class="button-link" href="#inline-table">표 삽입</a></div>
    </aside>
  </main>
</body>
</html>

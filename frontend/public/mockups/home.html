<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>환승 홀 — 톤 목업</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0D131C;
      --text: #F3F6FB;
      --text-2: #AEB8C8;
      --muted: #7C8AA0;
      --line: rgba(255,255,255,.09);
      --safety: #F3C544;
      --line-b: #E14D78;
      --line-b-text: #F07CA0;
      --line-v: #55738F;
      --line-v-text: #9CB8D2;
      --line-s: #9AA8B5;
      --line-w: #35C275;
      --line-r: #5B8DEF;
      font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 1rem; line-height: 1.55; }
    .mockup-banner { position: fixed; inset: 0 0 auto; z-index: 9; padding: 7px; background: var(--safety); color: #201A05; text-align: center; font-size: 12px; font-weight: 800; }
    main { max-width: 760px; margin: auto; padding: 60px 20px 48px; }
    a { color: inherit; text-decoration: none; }
    a:hover .name, .index-link:hover { text-decoration: underline; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--safety); outline-offset: 3px; }
    .station-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 1.125rem; margin: 0; font-weight: 700; }
    .index-link { margin-left: auto; padding: 10px 0 10px 10px; color: var(--text-2); font-size: .875rem; }
    .badge { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: 0 0 24px; border: 1.5px solid currentColor; border-radius: 50%; font-size: .75rem; font-weight: 800; line-height: 1; }
    .central { color: var(--safety); }
    .blog { color: var(--line-b-text); border-color: var(--line-b); }
    .voyage { color: var(--line-v-text); border-color: var(--line-v); }
    .play { color: var(--line-s); }
    .work { color: var(--line-w); }
    .runtime { color: var(--line-r); }
    .planned { color: var(--muted); border-style: dashed; }
    .map-hero { margin: 24px 0 36px; padding-left: 12px; border-left: 3px solid var(--safety); }
    .network { display: block; width: 100%; max-width: 560px; height: auto; margin: auto; }
    .network .track { fill: none; stroke: var(--route-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .network .node { fill: var(--bg); stroke: var(--route-color); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .network text { fill: var(--text-2); font-family: inherit; font-size: 16px; }
    .network .code { fill: var(--text); font-size: 12px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .network .unopened .track, .network .unopened .node { stroke-dasharray: 4 5; }
    .network .unopened text { fill: var(--muted); }
    .categories { display: grid; gap: 28px; }
    .category h2 { margin: 0 0 8px; font-size: .875rem; font-weight: 600; color: var(--text-2); }
    .rows, .journey-links { list-style: none; padding: 0; margin: 0; }
    .rows { margin-left: 12px; }
    .rows > li { border-bottom: 1px solid var(--line); }
    .row { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 10px; align-items: center; min-height: 56px; padding: 12px 0; }
    .name { min-width: 0; font-weight: 600; overflow-wrap: anywhere; word-break: keep-all; }
    .status { color: var(--text-2); text-align: right; font-size: .875rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .unavailable .name, .unavailable .status { color: var(--muted); }
    .journey-links { display: flex; flex-wrap: wrap; gap: 0 24px; margin: 0 0 4px 34px; }
    .journey-links a { display: block; padding: 10px 0; font-size: .875rem; color: var(--text-2); text-decoration: underline; text-underline-offset: 4px; }
    @media (min-width: 700px) { main { padding-top: 76px; } .categories { gap: 32px; } }
    @media (max-width: 360px) { .row { grid-template-columns: 24px minmax(0,1fr); } .status { grid-column: 2; text-align: left; } }
  </style>
</head>
<body>
  <header class="mockup-banner">MOCKUP — 실화면 아님 · tone r1</header>
  <main>
    <div class="station-bar">
      <span class="badge central" aria-hidden="true">W</span>
      <h1>환승 홀</h1>
      <a class="index-link" href="index.html">목업 목차</a>
    </div>

    <!-- 노선 위치는 lines.js의 중앙 환승점/좌우 지선을 모바일 약도로 단순화한다. -->
    <figure class="map-hero" aria-label="노선도">
      <svg class="network" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 290" role="img" aria-labelledby="network-title network-description">
        <title id="network-title">환승 홀 간단 노선도</title>
        <desc id="network-description">중앙에서 블로그, 여행, 배움, 놀이, 운영 노선으로 갈라집니다. 점선은 연결 준비 중인 배움과 개통 예정인 발견·취향 노선입니다. 이동은 아래 카테고리 목록을 이용하세요.</desc>
        <g class="unopened" style="--route-color:#7C8AA0" data-line="A">
          <path class="track" d="M175 160 L134 62 H28"/>
          <circle class="node" cx="28" cy="62" r="10"/><text class="code" x="28" y="62">A</text>
          <text x="12" y="38">Developer Advisor</text>
        </g>
        <g style="--route-color:var(--line-w)" data-line="W">
          <path class="track" d="M175 160 L130 112 H28"/>
          <circle class="node" cx="28" cy="112" r="10"/><text class="code" x="28" y="112">W</text>
          <text x="12" y="90">Work Manager</text>
        </g>
        <g style="--route-color:var(--line-r)" data-line="R">
          <path class="track" d="M175 160 L130 212 H28"/>
          <circle class="node" cx="28" cy="212" r="10"/><text class="code" x="28" y="212">R</text>
          <text x="12" y="192">Runtime Board</text>
        </g>
        <g style="--route-color:var(--line-v)" data-line="V">
          <path class="track" d="M175 160 L134 268 H28"/>
          <circle class="node" cx="28" cy="268" r="10"/><text class="code" x="28" y="268">V</text>
          <text x="12" y="246">여행 노선</text>
        </g>
        <g class="unopened" style="--route-color:#7C8AA0" data-line="D">
          <path class="track" d="M175 160 L216 62 H322"/>
          <circle class="node" cx="322" cy="62" r="10"/><text class="code" x="322" y="62">D</text>
          <text x="214" y="38">발견 노선</text>
        </g>
        <g style="--route-color:var(--line-b)" data-line="B">
          <path class="track" d="M175 160 L220 112 H322"/>
          <circle class="node" cx="322" cy="112" r="10"/><text class="code" x="322" y="112">B</text>
          <text x="214" y="90">블로그 본선</text>
        </g>
        <g style="--route-color:var(--line-s)" data-line="S">
          <path class="track" d="M175 160 L220 212 H322"/>
          <circle class="node" cx="322" cy="212" r="10"/><text class="code" x="322" y="212">S</text>
          <text x="214" y="192">미스터리 트레인</text>
        </g>
        <g class="unopened" style="--route-color:#7C8AA0" data-line="P">
          <path class="track" d="M175 160 L216 268 H322"/>
          <circle class="node" cx="322" cy="268" r="10"/><text class="code" x="322" y="268">P</text>
          <text x="214" y="246">취향 노선</text>
        </g>
        <circle cx="175" cy="160" r="9" fill="var(--bg)" stroke="var(--safety)" stroke-width="2"/>
      </svg>
    </figure>

    <nav class="categories" aria-label="카테고리별 이동">
      <section class="category" aria-labelledby="writing-heading">
        <h2 id="writing-heading">글쓰기</h2>
        <ul class="rows">
          <li><a class="row" href="blog-archive.html"><span class="badge blog" aria-hidden="true">B</span><span class="name">공개 아카이브</span><span class="status">읽기</span></a></li>
          <li><a class="row" href="blog-post.html"><span class="badge blog" aria-hidden="true">B</span><span class="name">글 상세</span><span class="status">본문</span></a></li>
          <li><a class="row" href="writing-studio.html"><span class="badge blog" aria-hidden="true">B</span><span class="name">Writing Studio</span><span class="status">초안 쓰기</span></a></li>
        </ul>
      </section>
      <section class="category" aria-labelledby="voyage-heading">
        <h2 id="voyage-heading">여행</h2>
        <ul class="rows">
          <li>
            <a class="row" href="voyage-prep.html"><span class="badge voyage" aria-hidden="true">V</span><span class="name">중부유럽 순환선</span><span class="status">여행 준비</span></a>
            <ul class="journey-links" aria-label="중부유럽 순환선 상세"><li><a href="voyage-daily.html">일일 운행 안내</a></li><li><a href="voyage-archive.html">여행 기록</a></li></ul>
          </li>
        </ul>
      </section>
      <section class="category" aria-labelledby="learning-heading">
        <h2 id="learning-heading">배움</h2>
        <ul class="rows"><li><div class="row unavailable"><span class="badge planned" aria-hidden="true">A</span><span class="name">Developer Advisor</span><span class="status">연결 준비 중</span></div></li></ul>
      </section>
      <section class="category" aria-labelledby="play-heading">
        <h2 id="play-heading">놀이</h2>
        <ul class="rows"><li><a class="row" href="simhub.html"><span class="badge play" aria-hidden="true">S</span><span class="name">미스터리 트레인</span><span class="status">격납고</span></a></li></ul>
      </section>
      <section class="category" aria-labelledby="operations-heading">
        <h2 id="operations-heading">운영</h2>
        <ul class="rows">
          <li><a class="row" href="work.html"><span class="badge work" aria-hidden="true">W</span><span class="name">Work Manager</span><span class="status">보호 구역</span></a></li>
          <li><a class="row" href="runtime.html"><span class="badge runtime" aria-hidden="true">R</span><span class="name">Runtime Board</span><span class="status">보호 구역</span></a></li>
        </ul>
      </section>
      <section class="category" aria-labelledby="upcoming-heading">
        <h2 id="upcoming-heading">개통 예정</h2>
        <ul class="rows">
          <li><div class="row unavailable"><span class="badge planned" aria-hidden="true">D</span><span class="name">발견 노선</span><span class="status">준비 중</span></div></li>
          <li><div class="row unavailable"><span class="badge planned" aria-hidden="true">P</span><span class="name">취향 노선</span><span class="status">준비 중</span></div></li>
        </ul>
      </section>
    </nav>
  </main>
</body>
</html>

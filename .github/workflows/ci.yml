name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  gateway-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run gateway tests with JaCoCo
        run: mvn -B test jacoco:report

      - name: Summarize gateway line coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.csv")
          with report.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          line_missed = sum(int(row["LINE_MISSED"]) for row in rows)
          line_covered = sum(int(row["LINE_COVERED"]) for row in rows)
          total = line_missed + line_covered
          coverage = 0.0 if total == 0 else (line_covered / total) * 100

          summary = f"Gateway line coverage: {coverage:.2f}% ({line_covered}/{total})"
          print(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Coverage\n")
              handle.write(summary + "\n")
              handle.write("- Local HTML report: `gateway/target/site/jacoco/index.html`\n")
          PY

      - name: Upload gateway coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-jacoco-report
          path: gateway/target/site/jacoco
          if-no-files-found: error

name: advisor-lab

# lab/* 브랜치에 labs/advisor/** 가 push 되면 채점한다. push 트리거만 쓴다(포크 PR·pull_request_target 없음).
# 학습자 코드는 grade 잡(읽기 권한·시크릿 없음)에서만 실행하고,
# 키와 쓰기 권한은 학습자 코드를 실행하지 않는 publish 잡에만 준다.
on:
  push:
    branches: ['lab/**']
    paths: ['labs/advisor/**']

concurrency:
  group: advisor-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grade:
    # 되먹임 방지: 봇 커밋·[skip ci] 는 건너뛴다.
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.author.name != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      has_missions: ${{ steps.find.outputs.has_missions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 바뀐 미션 폴더 찾기
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grade-out"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git ls-files 'labs/advisor' > "$RUNNER_TEMP/changed.txt"        # 첫 push: 브랜치 전체
          else
            git diff --name-only "$BEFORE" "$SHA" -- labs/advisor > "$RUNNER_TEMP/changed.txt"
          fi
          # .grade/ 만 바뀐 건 제외하고 <id> 추출 (영문·숫자·하이픈만)
          grep -v '/\.grade/' "$RUNNER_TEMP/changed.txt" \
            | sed -n 's#^labs/advisor/\([A-Za-z0-9-][A-Za-z0-9-]*\)/.*#\1#p' | sort -u > "$RUNNER_TEMP/grade-out/missions.txt" || true
          cp "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/grade-out/changed.txt"
          if [ -s "$RUNNER_TEMP/grade-out/missions.txt" ]; then
            echo "has_missions=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/grade-out/missions.txt"
          else
            echo "has_missions=false" >> "$GITHUB_OUTPUT"
            echo "채점할 미션 폴더 없음"
          fi

      - uses: actions/setup-java@v4
        if: steps.find.outputs.has_missions == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: labs/advisor/**/pom.xml

      - name: 미션별 mvn test + 채점 (실패해도 다음 미션 계속)
        if: steps.find.outputs.has_missions == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          {
            echo "## Advisor 실습 채점"
            echo
            echo "| 미션 | 난이도 | 컴파일 | 통과/전체 | 실패 | 오류 | 건너뜀 |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r id; do
            dir="labs/advisor/$id"
            [ -f "$dir/pom.xml" ] || { echo "$id: pom.xml 없음 — 건너뜀"; continue; }
            log="$RUNNER_TEMP/$id.mvn.log"
            ( cd "$dir" && mvn -B -q test ) > "$log" 2>&1
            rc=$?
            echo "$id: mvn 종료 코드 $rc"
            python3 tools/advisor-lab-grade.py --mission-dir "$dir" --commit "$SHA" \
              --mvn-exit "$rc" --build-log "$log" \
              --out-dir "$RUNNER_TEMP/grade-out/$id" --summary "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/grade-out/missions.txt"

      - uses: actions/upload-artifact@v4
        if: steps.find.outputs.has_missions == 'true'
        with:
          name: advisor-lab-grade
          path: ${{ runner.temp }}/grade-out
          retention-days: 1

  publish:
    needs: grade
    if: needs.grade.outputs.has_missions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # 이 잡에만 — 학습자 코드를 실행하지 않는다
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: advisor-lab-grade
          path: ${{ runner.temp }}/grade-out

      # grade 잡은 학습자 코드를 실행했으므로 artifact 의 목록(missions.txt·changed.txt)은 믿지 않는다.
      # 여기서 git 으로 다시 계산하고, artifact 에서는 <id>/result.json 만 쓴다.
      - name: 바뀐 미션·파일 목록 직접 계산
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git ls-files 'labs/advisor' > "$RUNNER_TEMP/pub/changed.txt"
          else
            git diff --name-only "$BEFORE" "$SHA" -- labs/advisor > "$RUNNER_TEMP/pub/changed.txt"
          fi
          grep -v '/\.grade/' "$RUNNER_TEMP/pub/changed.txt" \
            | sed -n 's#^labs/advisor/\([A-Za-z0-9-][A-Za-z0-9-]*\)/.*#\1#p' | sort -u > "$RUNNER_TEMP/pub/missions.txt" || true

      - name: 채점 결과 배치
        run: |
          set -euo pipefail
          while read -r id; do
            case "$id" in ''|*[!A-Za-z0-9-]*) echo "잘못된 id 무시"; continue;; esac
            src="$RUNNER_TEMP/grade-out/$id/result.json"
            dir="labs/advisor/$id"
            if [ -f "$src" ] && [ ! -L "$src" ] && [ ! -L "$RUNNER_TEMP/grade-out/$id" ] && [ -d "$dir" ]; then
              mkdir -p "$dir/.grade"
              cp "$src" "$dir/.grade/result.json"
            fi
          done < "$RUNNER_TEMP/pub/missions.txt"

      - name: Claude 리뷰
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADVISOR_REVIEW_MODEL: ${{ vars.ADVISOR_REVIEW_MODEL }}
        run: |
          set -uo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "키 없음 — 리뷰 건너뜀"
            exit 0
          fi
          while read -r id; do
            case "$id" in ''|*[!A-Za-z0-9-]*) continue;; esac
            [ -f "labs/advisor/$id/.grade/result.json" ] || continue
            python3 tools/advisor-lab-review.py --mission-dir "labs/advisor/$id" \
              --changed-files "$RUNNER_TEMP/pub/changed.txt" || echo "$id: 리뷰 단계 오류(계속)"
          done < "$RUNNER_TEMP/pub/missions.txt"

      - name: .grade 커밋·push
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$B64"
          committed=0
          while read -r id; do
            case "$id" in ''|*[!A-Za-z0-9-]*) continue;; esac
            dir="labs/advisor/$id"
            [ -d "$dir/.grade" ] || continue
            git add -f -- "$dir/.grade"
            if git diff --cached --quiet -- "$dir/.grade"; then continue; fi
            p=$(python3 -c "import json,sys;r=json.load(open(sys.argv[1]));print('%d/%d'%(r['passed'],r['tests']))" "$dir/.grade/result.json")
            git commit -q -m "advisor-lab: $id 채점 $p [skip ci]" -- "$dir/.grade"
            committed=1
          done < "$RUNNER_TEMP/pub/missions.txt"
          if [ "$committed" = 1 ]; then
            # checkout 은 sha 고정(detached)이라 브랜치가 앞서 있으면 거부된다 — cancel-in-progress 가 막아 준다.
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $B64" push "https://github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
          else
            echo "바뀐 채점 결과 없음 — 커밋 안 함"
          fi

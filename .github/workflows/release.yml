name: Release baseline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v$(cat VERSION)"
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate tag against VERSION
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(cat VERSION)"
          EXPECTED_TAG="v${VERSION_VALUE}"
          ACTUAL_TAG="${{ steps.release_tag.outputs.tag }}"
          if [ "${ACTUAL_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "릴리스 태그가 VERSION 과 일치하지 않습니다." >&2
            echo "actual=${ACTUAL_TAG}" >&2
            echo "expected=${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Release checklist
        shell: bash
        run: |
          set -euo pipefail
          echo "릴리스 태그: ${{ steps.release_tag.outputs.tag }}"
          echo "태그 push 시 GitHub Release 생성/갱신을 자동으로 시도한다."

      - name: Create or update GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.release_tag.outputs.tag }}`;
            const repo = context.repo;
            const releaseName = tag;
            const releaseBody = [
              '자동 생성 릴리스입니다.',
              '',
              `- VERSION 검증 통과: ${tag}`,
              '- 상세 작업 이력과 운영 메모는 docs/releases.md 와 로컬 운영 문서를 함께 확인한다.'
            ].join('\n');

            let existing = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: repo.owner,
                repo: repo.repo,
                tag
              });
              existing = response.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (existing) {
              await github.rest.repos.updateRelease({
                owner: repo.owner,
                repo: repo.repo,
                release_id: existing.id,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false
              });
              core.notice(`Updated GitHub Release for ${tag}`);
            } else {
              await github.rest.repos.createRelease({
                owner: repo.owner,
                repo: repo.repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
                generate_release_notes: true
              });
              core.notice(`Created GitHub Release for ${tag}`);
            }
